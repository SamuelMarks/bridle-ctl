name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  rust:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    env:
      BRIDLE_ALLOW_GITHUB_MUTATION: "0"
      GITHUB_API_URL: "http://127.0.0.1:1"
      GITHUB_URL: "127.0.0.1:1"
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: samuel
          POSTGRES_DB: bridle_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Default Branch
        run: |
          git config --global init.defaultBranch master
          git config --global user.name "Bridle CI"
          git config --global user.email "ci@bridle.local"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libsqlite3-dev llvm llvm-dev libclang-dev clang lld
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy, llvm-tools-preview
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Format Check
        run: cargo fmt --all -- --check
      - name: Clippy Check
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin
      - name: Run tests and collect coverage
        run: DATABASE_URL=postgres://samuel@localhost:5432/bridle_test cargo tarpaulin --engine llvm --out Xml --fail-under 100 --exclude-files "bridle-models/src/schema.rs" --exclude-files "bridle-sdk/tests/schema_parity.rs" -- --test-threads=1
      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: cobertura.xml

  ui:
    name: UI Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bridle-ui
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: "./bridle-ui/package-lock.json"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test -- --browsers=ChromeHeadless
      - name: Verify Chrome for Playwright
        run: |
          if [ ! -x /opt/google/chrome/chrome ] && ! command -v google-chrome >/dev/null 2>&1; then
            npx playwright install --with-deps chrome
          fi
      - name: Run E2E tests
        run: npm run e2e
